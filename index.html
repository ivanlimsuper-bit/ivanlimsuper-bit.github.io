<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUTUREFRAME — The future, in 60 seconds.</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0A;color:#F2F2F2;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;justify-content:center}
.w{width:100%;max-width:430px;padding:48px 24px 64px;text-align:center}
.logo{font-weight:800;font-size:2rem;letter-spacing:.1em}.logo span{color:#00E5A0}
.tag{color:#9a9a9a;margin:10px 0 34px;font-size:.95rem}
a.btn{display:block;padding:15px 18px;margin:12px 0;border:1px solid #2a2a2a;border-radius:14px;background:#141414;color:#F2F2F2;text-decoration:none;font-weight:600;transition:transform .12s,border-color .12s}
a.btn:hover{border-color:#00E5A0;transform:translateY(-2px)}
.cap{margin-top:38px;padding:24px 20px;border:1px solid #222;border-radius:16px;background:#101010}
.cap h2{font-size:1.05rem;margin-bottom:6px}.cap p{color:#9a9a9a;font-size:.85rem;margin-bottom:16px}
.cap form{display:flex;gap:8px}
.cap input{flex:1;padding:13px 14px;border-radius:10px;border:1px solid #2c2c2c;background:#0d0d0d;color:#F2F2F2;font-size:.95rem;outline:none}
.cap input:focus{border-color:#00E5A0}
.cap button{padding:13px 18px;border:none;border-radius:10px;background:#00E5A0;color:#062018;font-weight:700;cursor:pointer;font-size:.95rem}
.msg{margin-top:12px;font-size:.85rem;min-height:1.2em}.msg.ok{color:#00E5A0}.msg.err{color:#ff7b7b}
footer{margin-top:44px;color:#555;font-size:.72rem}footer a{color:#777}
</style></head>
<body><div class="w">
<div class="logo">FUTURE<span>FRAME</span></div>
<p class="tag">The future, in 60 seconds.</p>
<a class="btn" href="https://www.youtube.com/channel/UCB4OWT1yNJL3Q6Jorzp9pZA" target="_blank" rel="noopener">▶ YouTube</a>
<a class="btn" href="https://www.instagram.com/futureframe.60" target="_blank" rel="noopener">📷 Instagram</a>
<a class="btn" href="https://www.tiktok.com/@futureframe.60" target="_blank" rel="noopener">🎵 TikTok</a>
<div class="cap">
<h2>The Weekly Future Brief</h2>
<p>The 3 breakthroughs that matter this week — one email, no spam, unsubscribe anytime.</p>
<form id="f"><input type="email" id="e" placeholder="your@email.com" required autocomplete="email"><button type="submit">Join</button></form>
<div class="msg" id="m"></div>
</div>
<footer>© 2026 FUTUREFRAME · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></footer>
</div>
<script>
document.getElementById('f').addEventListener('submit',async function(ev){ev.preventDefault();var b=document.getElementById('m');var em=document.getElementById('e').value.trim();b.className='msg';b.textContent='...';try{var r=await fetch('https://sssuper.app.n8n.cloud/webhook/futureframe-subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,lang:(navigator.language||'en').slice(0,2),source:'bio-link'})});var d=await r.json().catch(function(){return{}});if(r.ok&&d.ok!==false){b.className='msg ok';b.textContent='✓ You are in. Watch your inbox on Sunday.';document.getElementById('e').value=''}else{b.className='msg err';b.textContent=(d.message||'Something went wrong — try again.')}}catch(err){b.className='msg err';b.textContent='Network error — try again.'}});
</script></body></html>
